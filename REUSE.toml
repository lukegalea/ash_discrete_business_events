version = 1

# Source files carry their own SPDX header; this annotation covers everything
# else (prose docs, dotfiles, the lockfile) so `reuse lint` stays clean from
# day one — the cautionary example is ash_agent_tools, whose REUSE state ran
# red until AST-1 fixed it.
[[annotations]]
path = [
  ".credo.exs",
  ".formatter.exs",
  ".github/**/*.yml",
  ".gitignore",
  "README.md",
  "REUSE.toml",
  "docs/**/*.md",
  "mix.lock",
  "priv/resource_snapshots/**/*.json",
  "priv/test_repo/migrations/*.exs",
  "usage-rules.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_discrete_business_events contributors <https://github.com/lukegalea/ash_discrete_business_events>"
SPDX-License-Identifier = "MIT"

# The Salesforce fixture corpus is DATA, deliberately rights-free (the
# AST-153 corpus pattern): CC0-1.0. The generator script carries its own
# inline CC0 header.
[[annotations]]
path = [
  "priv/fixtures/salesforce/*.csv",
  "priv/fixtures/salesforce/manifest.json",
  "priv/fixtures/salesforce/README.md",
  "priv/fixtures/salesforce/LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_discrete_business_events contributors <https://github.com/lukegalea/ash_discrete_business_events>"
SPDX-License-Identifier = "CC0-1.0"
